[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.11.2",
    "fastapi>=0.128.0",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "pyarrow>=23.0.0",
    "requests>=2.32.5",
    "uvicorn>=0.40.0",
    "yfinance>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "data", "backtest_results"]
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["E501"]
