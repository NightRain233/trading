version: '3.8'

services:
  backend:
    build:
      context: ./backend
      network: host
      args:
        - HTTP_PROXY=http://127.0.0.1:7890
        - HTTPS_PROXY=http://127.0.0.1:7890
    restart: always
    network_mode: "host"
    environment:
      - HTTP_PROXY=http://127.0.0.1:7890
      - HTTPS_PROXY=http://127.0.0.1:7890
      - EASTMONEY_FETCH_ENABLED=${EASTMONEY_FETCH_ENABLED:-true}
      - EASTMONEY_PROXY_MODE=${EASTMONEY_PROXY_MODE:-direct}
      - EASTMONEY_MIN_INTERVAL_SECONDS=${EASTMONEY_MIN_INTERVAL_SECONDS:-1.5}
      - EASTMONEY_CIRCUIT_COOLDOWN_SECONDS=${EASTMONEY_CIRCUIT_COOLDOWN_SECONDS:-1800}
      - EASTMONEY_FULL_REFRESH_DAYS=${EASTMONEY_FULL_REFRESH_DAYS:-7}
      - EASTMONEY_INCREMENTAL_OVERLAP_DAYS=${EASTMONEY_INCREMENTAL_OVERLAP_DAYS:-14}
      - YAHOO_FETCH_ENABLED=${YAHOO_FETCH_ENABLED:-true}
      - YAHOO_MIN_INTERVAL_SECONDS=${YAHOO_MIN_INTERVAL_SECONDS:-1.0}
      - YAHOO_CIRCUIT_COOLDOWN_SECONDS=${YAHOO_CIRCUIT_COOLDOWN_SECONDS:-900}
      - BACKGROUND_PREWARM_ENABLED=${BACKGROUND_PREWARM_ENABLED:-true}
      - PREWARM_HOURS=${PREWARM_HOURS:-12,21}
    volumes:
      - ./backend/data:/app/data
      - ./backend/backtest_results:/app/backtest_results
      - ./backend/watchlist.json:/app/watchlist.json

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        - HTTP_PROXY=http://127.0.0.1:7890
        - HTTPS_PROXY=http://127.0.0.1:7890
    restart: always
    network_mode: "host"
    depends_on:
      - backend
