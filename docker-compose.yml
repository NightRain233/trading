version: '3.8'

services:
  backend:
    build:
      context: ./backend
      network: host
      args:
        - HTTP_PROXY=http://127.0.0.1:7890
        - HTTPS_PROXY=http://127.0.0.1:7890
    restart: always
    network_mode: "host"
    environment:
      - TICKFLOW_FETCH_ENABLED=${TICKFLOW_FETCH_ENABLED:-true}
      - TICKFLOW_BASE_URL=${TICKFLOW_BASE_URL:-https://free-api.tickflow.org}
      - TICKFLOW_API_KEY=${TICKFLOW_API_KEY:-}
      - TICKFLOW_MIN_INTERVAL_SECONDS=${TICKFLOW_MIN_INTERVAL_SECONDS:-1.0}
      - TICKFLOW_CIRCUIT_COOLDOWN_SECONDS=${TICKFLOW_CIRCUIT_COOLDOWN_SECONDS:-900}
      - TICKFLOW_INCREMENTAL_OVERLAP_DAYS=${TICKFLOW_INCREMENTAL_OVERLAP_DAYS:-7}
      - YAHOO_FETCH_ENABLED=${YAHOO_FETCH_ENABLED:-true}
      - YAHOO_MIN_INTERVAL_SECONDS=${YAHOO_MIN_INTERVAL_SECONDS:-1.0}
      - YAHOO_CIRCUIT_COOLDOWN_SECONDS=${YAHOO_CIRCUIT_COOLDOWN_SECONDS:-900}
      - BACKGROUND_PREWARM_ENABLED=${BACKGROUND_PREWARM_ENABLED:-true}
      - PREWARM_TIMES=${PREWARM_TIMES:-07:30,21:00}
      - HTTP_PROXY=http://127.0.0.1:7890
      - HTTPS_PROXY=http://127.0.0.1:7890
      - NO_PROXY=127.0.0.1,localhost,.cn,.com.cn,free-api.tickflow.org
    volumes:
      - ./backend/data:/app/data
      - ./backend/backtest_results:/app/backtest_results
      - ./backend/watchlist.json:/app/watchlist.json
      - ./scripts:/app/scripts:ro

  frontend:
    build:
      context: ./frontend
      network: host
      args:
        - HTTP_PROXY=http://127.0.0.1:7890
        - HTTPS_PROXY=http://127.0.0.1:7890
    restart: always
    network_mode: "host"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
